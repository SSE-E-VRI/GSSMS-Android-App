name: gssms_mobile
description: "GSSMS Mobile Application for field operations"
publish_to: 'none'
version: 0.3.1+5

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.4.3+1
  flutter_secure_storage: ^11.2.0
  jwt_decoder: ^2.0.1
  equatable: ^2.0.5
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  pdf: ^3.11.3
  meta: ^1.15.0
  vector_math: ^2.1.4
  printing: ^5.14.3
  mobile_scanner: ^7.4.2
  geolocator: ^14.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  custom_lint: ^0.6.4
  gssms_lints:
    path: packages/gssms_lints

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/report/
