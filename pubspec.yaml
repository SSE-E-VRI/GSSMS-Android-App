name: gssms_mobile
description: "GSSMS Mobile Application for field operations"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  equatable: ^2.0.5
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.5
  fl_chart: ^0.68.0
  pdf: ^3.11.3
  printing: ^5.14.3
  mobile_scanner: ^5.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  custom_lint: ^0.6.4
  gssms_lints:
    path: packages/gssms_lints

flutter:
  uses-material-design: true
