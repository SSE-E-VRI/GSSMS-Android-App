org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Clear deprecated ANDROID_PREFS_ROOT to resolve AGP 8.3 AndroidLocationsException conflict with ANDROID_USER_HOME
systemProp.ANDROID_PREFS_ROOT=

# Suppress unsupported compileSdk warning (compileSdk 35 with AGP 8.3)
android.suppressUnsupportedCompileSdk=35


