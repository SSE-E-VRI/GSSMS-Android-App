org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Clear deprecated ANDROID_PREFS_ROOT to resolve AGP AndroidLocationsException conflict with ANDROID_USER_HOME
systemProp.ANDROID_PREFS_ROOT=


# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Disable Kotlin incremental compilation to avoid cross-drive path resolution bug on Windows (C:\ pub-cache vs D:\ project)
kotlin.incremental=false
