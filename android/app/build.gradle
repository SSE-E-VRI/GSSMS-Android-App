plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

import java.io.FileInputStream
import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.ssee_vri.gssms_mobile"
    compileSdk = 36

    buildFeatures {
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.ssee_vri.gssms_mobile"
        // flutter_secure_storage encrypted prefs need 23+; CameraX/mobile_scanner need 24+.
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "GSSMS Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "GSSMS Staging"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "GSSMS"
            // prod must never fall back to debug signing (OEM installers, e.g. Vivo/Funtouch,
            // reject debug-signed APKs as "appears to be invalid" on sideload) — always use the
            // real release keystore. The missing-keystore check itself lives below, attached
            // only to prod-release tasks: throwing here unconditionally ran at *configuration*
            // time for every Gradle invocation, including plain `assembleDevDebug`, which broke
            // CI (no key.properties in that environment, and it has no reason to need one).
            signingConfig = signingConfigs.release
        }
    }

    // Fail loudly, but only when a prod-release task is actually requested, if
    // android/key.properties is missing — rather than silently shipping a
    // debug-signed build.
    afterEvaluate {
        tasks.matching { it.name ==~ /.*ProdRelease.*/ }.configureEach { task ->
            task.doFirst {
                if (!keystorePropertiesFile.exists()) {
                    throw new GradleException(
                        "android/key.properties is missing. The prod flavor refuses to build " +
                        "without a real release keystore — a debug-signed prod APK gets rejected " +
                        "by OEM installers (e.g. 'App not installed as package appears to be invalid'). " +
                        "See SSOT/GSSMS_SOURCE_VERSION_DISTRIBUTION_PLAN.md for the signing setup."
                    )
                }
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            // AGP enables R8 minification by default for release even without
            // minifyEnabled ever being set here. shared_preferences_android's
            // JNI-based implementation does a runtime method lookup by exact
            // signature string; R8 renames `Continuation` inside the
            // implementing class without keeping the native JNI caller in
            // sync, producing a NoSuchMethodError at runtime ("Could not load
            // job works"). This app never opted into minification, so turn
            // off the new default rather than chase proguard-keep gaps in a
            // third-party plugin's packaging.
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

