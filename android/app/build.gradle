plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

import java.io.FileInputStream
import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.ssee_vri.gssms_mobile"
    compileSdk = 36

    buildFeatures {
        resValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.ssee_vri.gssms_mobile"
        // flutter_secure_storage encrypted prefs need 23+; CameraX/mobile_scanner need 24+.
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "GSSMS Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "GSSMS Staging"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "GSSMS"
            // prod must never fall back to debug signing (OEM installers, e.g. Vivo/Funtouch,
            // reject debug-signed APKs as "appears to be invalid" on sideload) — always use the
            // real release keystore, and fail loudly here if android/key.properties is missing
            // rather than silently shipping a debug-signed build.
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "android/key.properties is missing. The prod flavor refuses to build " +
                    "without a real release keystore — a debug-signed prod APK gets rejected " +
                    "by OEM installers (e.g. 'App not installed as package appears to be invalid'). " +
                    "See SSOT/GSSMS_SOURCE_VERSION_DISTRIBUTION_PLAN.md for the signing setup."
                )
            }
            signingConfig = signingConfigs.release
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

