allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    // AGP GenerateTestConfig relativizes plugin paths. On Windows the Pub
    // cache may live on another drive, so its build output must share that
    // drive. Keep outputs in Gradle's cache rather than modifying Pub sources.
    def separateDrive = System.getProperty("os.name").toLowerCase().contains("windows") &&
        project.projectDir.toPath().root != rootProject.projectDir.toPath().root
    project.buildDir = separateDrive
        ? new File(gradle.gradleUserHomeDir, "caches/gssms-native/${Integer.toHexString(rootProject.projectDir.absolutePath.hashCode())}/${project.name}")
        : "${rootProject.buildDir}/${project.name}"
}
// Some plugins pin an old compileSdk (image_picker_android 0.8.12 uses 34) while
// their androidx deps need 35+, which fails checkReleaseAarMetadata. Align every
// plugin library with the app's compileSdk. Must be registered before the
// evaluationDependsOn block below so it runs when each plugin is evaluated.
subprojects {
    afterEvaluate { p ->
        if (p.hasProperty("android") && p.name != "app") {
            p.android.compileSdk = 36
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
