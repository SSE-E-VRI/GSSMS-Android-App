name: GSSMS Mobile CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  analyze-and-test:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml requires Flutter >=3.47.0 <3.48.0; keep this in step with it.
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Report-only: the code base is not dart-format clean (227 files), and a mass
      # reformat would collide with in-flight work. Make blocking again after one.
      - name: Verify formatting (report only)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test --coverage

      - name: Build Android Debug APK
        run: flutter build apk --debug

